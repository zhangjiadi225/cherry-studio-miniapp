<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/__cherry/theme.css" />
    <title>纪元织造者</title>
  </head>
  <body>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">EW</span>
          <span>
            <strong>纪元织造者</strong>
            <small>EPOCH WEAVER</small>
          </span>
        </div>
        <div class="host-status">
          <span class="pulse"></span>
          <span id="model-status">正在连接时代引擎</span>
        </div>
      </header>

      <main>
        <section id="setup-panel" class="setup-panel">
          <p class="eyebrow">THE FIRST SIGNAL · 第一束信号</p>
          <h1>选择一个文明的<br /><em>初始火种</em></h1>
          <p class="intro">
            规则决定文明是否存续，AI 讲述世界如何回应。每一次选择都会立即写入本地纪年。
          </p>

          <div class="seed-grid">
            <button class="seed-card" type="button" data-seed="tidal">
              <span class="seed-index">01</span>
              <strong>潮汐群岛</strong>
              <span>漂浮城市沿月潮迁徙，记忆被刻进鲸骨。</span>
              <i>适应 · 共生 · 迁徙</i>
            </button>
            <button class="seed-card" type="button" data-seed="glass">
              <span class="seed-index">02</span>
              <strong>玻璃荒原</strong>
              <span>恒星风暴熔化大地，幸存者在折射光中交流。</span>
              <i>工程 · 秩序 · 光</i>
            </button>
            <button class="seed-card" type="button" data-seed="forest">
              <span class="seed-index">03</span>
              <strong>夜语森林</strong>
              <span>植物会保存梦境，城邦围绕一棵失眠的古树生长。</span>
              <i>梦境 · 生长 · 秘密</i>
            </button>
          </div>
        </section>

        <section id="game-panel" class="game-panel" hidden>
          <div class="game-heading">
            <div>
              <p id="epoch-label" class="eyebrow">纪元 01</p>
              <h1 id="civilization-name">潮汐群岛</h1>
            </div>
            <button id="reset-button" class="ghost-button" type="button">重启文明</button>
          </div>

          <div class="metrics">
            <div class="metric">
              <span>稳定度</span>
              <strong id="stability-value">72</strong>
              <div class="meter"><i id="stability-meter"></i></div>
            </div>
            <div class="metric">
              <span>洞察</span>
              <strong id="insight-value">18</strong>
              <div class="meter"><i id="insight-meter"></i></div>
            </div>
            <div class="metric">
              <span>能量</span>
              <strong id="energy-value">64</strong>
              <div class="meter"><i id="energy-meter"></i></div>
            </div>
          </div>

          <article class="chronicle-card">
            <div class="chronicle-meta">
              <span>WORLD RESPONSE</span>
              <span id="save-status">已写入纪年</span>
            </div>
            <p id="narrative" aria-live="polite"></p>
            <button id="resume-button" class="resume-button" type="button" hidden>继续上次中断的推演</button>
          </article>

          <section class="decision-panel" aria-labelledby="decision-title">
            <div class="decision-copy">
              <p class="eyebrow">YOUR DECISION</p>
              <h2 id="decision-title">下一段纪元，把力量投向哪里？</h2>
            </div>
            <div class="action-grid">
              <button type="button" data-action="explore">
                <span>探索边界</span>
                <small>洞察 + · 稳定度 −</small>
              </button>
              <button type="button" data-action="build">
                <span>建造奇迹</span>
                <small>稳定度 + · 能量 −</small>
              </button>
              <button type="button" data-action="connect">
                <span>连接众生</span>
                <small>能量 + · 洞察 +</small>
              </button>
            </div>
          </section>
        </section>
      </main>

      <footer>
        <span>LOCAL RULES × CHERRY AI</span>
        <span>你的模型，你的纪元</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
