<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/__cherry/theme.css" />
    <title>__APP_NAME__</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">CHERRY MINI APP</p>
        <h1>__APP_NAME__</h1>
        <p class="lede">从一个明确任务开始，再把它打磨成独特的 AI 产品。</p>
      </header>

      <form id="prompt-form" class="composer">
        <label for="prompt">今天想完成什么？</label>
        <textarea id="prompt" rows="5" placeholder="描述目标、背景和你想要的结果……" required></textarea>
        <div class="actions">
          <span id="status" aria-live="polite">就绪</span>
          <button type="submit">开始生成</button>
        </div>
      </form>

      <section class="result" aria-labelledby="result-title">
        <div class="result-heading">
          <h2 id="result-title">结果</h2>
          <button id="clear-button" class="secondary" type="button">清空</button>
        </div>
        <p id="output" class="output">生成内容会出现在这里。</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
